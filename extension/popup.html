<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f14;
      color: #f2f2f7;
    }
    header {
      padding: 14px 16px;
      font-weight: 800;
      font-size: 16px;
      border-bottom: 1px solid #2a2a36;
    }
    #items { max-height: 320px; overflow-y: auto; }
    .item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #22222c;
    }
    .item img, .item .ph {
      width: 42px; height: 42px;
      border-radius: 8px;
      background: #fff;
      object-fit: contain;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .info { flex: 1; min-width: 0; }
    .title {
      font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .shop { font-size: 10px; color: #9a9aa8; }
    .price { font-size: 12px; font-weight: 700; margin-top: 2px; }
    .remove {
      background: none; border: none; color: #9a9aa8;
      cursor: pointer; font-size: 14px;
    }
    .empty { padding: 36px 16px; text-align: center; color: #9a9aa8; font-size: 13px; }
    footer { padding: 14px 16px; }
    .total {
      display: flex; justify-content: space-between;
      font-size: 14px; margin-bottom: 12px;
    }
    #checkout {
      width: 100%;
      background: linear-gradient(135deg, #ff4d6d, #ff7a5c);
      border: none; color: #fff;
      font-weight: 800; font-size: 14px;
      padding: 12px; border-radius: 12px; cursor: pointer;
    }
    #checkout:disabled { opacity: 0.4; cursor: not-allowed; }
    .settings {
      margin-top: 10px; font-size: 11px; color: #9a9aa8;
    }
    .settings input {
      width: 100%; box-sizing: border-box; margin-top: 4px;
      background: #1a1a23; border: 1px solid #2f2f3c; border-radius: 8px;
      color: #f2f2f7; padding: 7px 10px; font-size: 11px;
    }
  </style>
</head>
<body>
  <header>🛍️ Shoppy-Warenkorb</header>
  <div id="items"></div>
  <footer>
    <div class="total"><span>Gesamt</span><strong id="total">0,00 €</strong></div>
    <button id="checkout" disabled>Zur Shoppy-Kasse 🚀</button>
    <div class="settings">
      Shoppy-Webseite (für Kasse &amp; Liefer-Tracking):
      <input type="url" id="app-url" placeholder="https://…/shoppy/" />
    </div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
